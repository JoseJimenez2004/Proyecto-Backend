server:
  port: 18081

spring:
  application:
    name: auth-service
  datasource:
    # H2 en memoria: se crea al arrancar y se borra al detener el servicio.
    # Consola: http://localhost:<puerto>/h2-console  ·  JDBC URL: jdbc:h2:mem:auth  ·  usuario: sa  ·  sin contraseña
    url: jdbc:h2:mem:auth;DB_CLOSE_DELAY=-1
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  # Flyway solo se usa con PostgreSQL (perfil postgres); con H2 las tablas las crea Hibernate.
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:18761/eureka}
  instance:
    prefer-ip-address: true

seguridad:
  jwt:
    # Debe ser EL MISMO valor en auth, catalogos e inventario. En producción, por variable de entorno.
    secreto: ${JWT_SECRET:desarrollo-escom-inventario-cambiar-este-secreto-2026}
    emisor: inventario-escom
    expiracion-minutos: 480
  rutas-publicas:
    - /api/auth/login
    - /h2-console/**

management:
  endpoints:
    web:
      exposure:
        include: health,info
