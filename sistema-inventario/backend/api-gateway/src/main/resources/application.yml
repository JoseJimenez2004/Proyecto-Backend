server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth-service
              uri: lb://auth-service
              predicates:
                - Path=/api/auth/**
            - id: catalogos-service
              uri: lb://catalogos-service
              predicates:
                - Path=/api/catalogos/**
            - id: inventario-service
              uri: lb://inventario-service
              predicates:
                - Path=/api/inventario/**
          default-filters:
            - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE
          # CORS para el frontend en desarrollo (ng serve en el puerto 4200)
          globalcors:
            cors-configurations:
              '[/**]':
                allowed-origins:
                  - ${FRONTEND_URL:http://localhost:4200}
                allowed-methods: [GET, POST, PUT, DELETE, OPTIONS]
                allowed-headers: ["*"]
                allow-credentials: true
                max-age: 3600

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
