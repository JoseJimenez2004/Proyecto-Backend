server:
  # Puertos del proyecto en el rango 18xxx para no chocar con Apache, Tomcat, XAMPP, etc.
  port: ${GATEWAY_PORT:18090}

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth-service
              uri: lb://auth-service
              predicates:
                - Path=/api/auth/**
            - id: catalogos-service
              uri: lb://catalogos-service
              predicates:
                - Path=/api/catalogos/**
            - id: inventario-service
              uri: lb://inventario-service
              predicates:
                - Path=/api/inventario/**
          default-filters:
            - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE
          # CORS para el frontend en desarrollo. Se acepta cualquier puerto de localhost porque
          # "ng serve" usa otro puerto si el 18200 está ocupado.
          globalcors:
            cors-configurations:
              '[/**]':
                allowed-origin-patterns:
                  - "http://localhost:*"
                  - "http://127.0.0.1:*"
                  - ${FRONTEND_URL:http://localhost:18200}
                allowed-methods: [GET, POST, PUT, DELETE, OPTIONS]
                allowed-headers: ["*"]
                allow-credentials: true
                max-age: 3600

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:18761/eureka}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
