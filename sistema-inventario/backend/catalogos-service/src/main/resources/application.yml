server:
  port: 18082

spring:
  application:
    name: catalogos-service
  # Datos de prueba del Avance 1 en src/main/resources/data.sql
  datasource:
    # H2 en memoria: se crea al arrancar y se borra al detener el servicio.
    # Consola: http://localhost:<puerto>/h2-console  ·  JDBC URL: jdbc:h2:mem:catalogos  ·  usuario: sa  ·  sin contraseña
    url: jdbc:h2:mem:catalogos;DB_CLOSE_DELAY=-1
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  # Flyway solo se usa con PostgreSQL (perfil postgres); con H2 las tablas las crea Hibernate.
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    # Ejecuta data.sql DESPUÉS de que Hibernate crea las tablas
    defer-datasource-initialization: true
  sql:
    init:
      mode: always

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:18761/eureka}
  instance:
    prefer-ip-address: true

seguridad:
  jwt:
    secreto: ${JWT_SECRET:desarrollo-escom-inventario-cambiar-este-secreto-2026}
    emisor: inventario-escom
    expiracion-minutos: 480
  rutas-publicas:
    - /h2-console/**

management:
  endpoints:
    web:
      exposure:
        include: health,info
