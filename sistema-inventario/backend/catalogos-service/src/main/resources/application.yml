server:
  port: 8082

spring:
  application:
    name: catalogos-service
  # Temporal: H2 en memoria con los datos de prueba del Avance 1 (data.sql).
  # Pendiente: PostgreSQL + Flyway con el script DDL del Avance 1.
  datasource:
    url: jdbc:h2:mem:catalogos;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    # Ejecuta data.sql DESPUÉS de que Hibernate crea las tablas
    defer-datasource-initialization: true
  sql:
    init:
      mode: always

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

seguridad:
  jwt:
    secreto: ${JWT_SECRET:desarrollo-escom-inventario-cambiar-este-secreto-2026}
    emisor: inventario-escom
    expiracion-minutos: 480

management:
  endpoints:
    web:
      exposure:
        include: health,info
